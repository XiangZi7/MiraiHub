<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>外观模式与错误态回归预览</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h, reactive, onMounted } from 'vue'
      import { createI18n } from 'vue-i18n'
      import { addCollection } from '@iconify/vue'
      import icons from 'virtual:mirai-icons'
      import SessionErrorNotice from '/src/components/ui/SessionErrorNotice.vue'
      import ToastHost from '/src/components/ui/ToastHost.vue'
      import ThemePreview from '/src/components/settings/ThemePreview.vue'
      import DatabaseConnectionState from '/src/components/workspace/database/DatabaseConnectionState.vue'
      import { messages } from '/src/i18n/messages.ts'
      import { toast } from '/src/composables/useToast.ts'
      import { pinia } from '/src/stores/index.ts'
      import { DEFAULT_SETTINGS } from '/src/types/settings.ts'
      import '/src/assets/styles/main.css'

      addCollection(icons)
      const i18n = createI18n({
        legacy: false,
        locale: 'zh-CN',
        fallbackLocale: 'zh-CN',
        messages,
        missingWarn: false,
        fallbackWarn: false,
      })

      const SCHEMES = ['dark', 'light']
      const state = reactive({
        scheme:
          new URLSearchParams(location.search).get('scheme') === 'light'
            ? 'light'
            : 'dark',
        password: '',
        // 连接状态页预览：当前场景与模拟出的会话状态
        scenario: 'auth',
        status: 'disconnected',
        error: '',
        errorKind: '',
      })
      // 预览用的连接：MySQL 生产库，经 SSH 隧道
      const PREVIEW_CONNECTION = {
        id: 'preview-mysql',
        name: '生产主库',
        kind: 'mysql',
        host: '10.0.0.12',
        port: 3306,
        username: 'root',
        group: '',
        description: '',
        tags: [],
        tagColor: 'blue',
        createdAt: 0,
        lastUsedAt: 0,
        settings: {
          database: 'app_db',
          ssl: false,
          environment: 'production',
          sshTunnel: {
            enabled: true,
            host: 'bastion-prod',
            port: 22,
            username: 'ops',
            auth: { type: 'agent' },
          },
        },
      }
      // 各场景对应的后端错误与 AppErrorKind；idle 表示未连接且没有错误
      const SCENARIOS = {
        auth: [
          "连接 root@10.0.0.12:3306 失败：error returned from database: 1045 (28000): Access denied for user 'root'@'172.17.0.1' (using password: YES)",
          'auth',
        ],
        refused: [
          'error communicating with database: 由于目标计算机积极拒绝，无法连接。 (os error 10061)',
          'network',
        ],
        tunnel: ['SSH 隧道失败：Connection refused (os error 111)', 'network'],
        unknown: ['something weird happened', 'internal'],
        idle: ['', ''],
      }
      // 切换预览场景，直接落到对应的失败或未连接态
      const pickScenario = scenario => {
        state.scenario = scenario
        state.status = 'disconnected'
        ;[state.error, state.errorKind] = SCENARIOS[scenario]
      }
      pickScenario('auth')
      let previewTimer = 0
      // 模拟一次连接：先进入连接中，4 秒后按当前场景失败；空错误的场景模拟取消
      const simulateConnect = () => {
        clearTimeout(previewTimer)
        state.status = 'connecting'
        state.error = ''
        state.errorKind = ''
        previewTimer = setTimeout(() => pickScenario(state.scenario), 4000)
      }
      // 取消模拟连接，回到未连接态
      const simulateCancel = () => {
        clearTimeout(previewTimer)
        state.status = 'disconnected'
      }
      // 这个页面不跑 settings-runtime，自己写明暗；真实应用由 applySkin 写入。
      const applyScheme = () => {
        document.documentElement.dataset.skinScheme = state.scheme
      }
      applyScheme()

      const switcher = () =>
        h(
          'div',
          { class: 'flex shrink-0 items-center gap-2' },
          SCHEMES.map(scheme =>
            h(
              'button',
              {
                type: 'button',
                class: ['seg', state.scheme === scheme && 'seg-active'],
                onClick: () => {
                  state.scheme = scheme
                  applyScheme()
                },
              },
              scheme
            )
          )
        )

      const section = (title, body, extra = '') =>
        h('section', { class: ['pane min-h-0', extra] }, [
          h(
            'header',
            { class: 'win-bar text-txt-2 shrink-0 pr-3 text-xs' },
            title
          ),
          body,
        ])

      createApp({
        setup() {
          // 语义辉光改成共用 utility 后，Toast 的三种语气都要还在。
          onMounted(() => {
            toast.error({
              title: '数据库连接失败',
              description: 'Access denied for user "mirai"@"10.0.0.2"',
              duration: 0,
            })
            toast.success({ title: '连接已建立', duration: 0 })
          })
          return () =>
            h('div', { class: 'win ambient h-screen w-screen' }, [
              h('header', { class: 'win-bar gap-4 pr-3' }, [
                h('span', { class: 'text-txt text-xs' }, '外观模式回归'),
                switcher(),
              ]),
              h('div', { class: 'flex min-h-0 flex-1 gap-3 p-3' }, [
                h('div', { class: 'flex min-h-0 flex-1 flex-col gap-3' }, [
                  section(
                    'SSH 终端错误（浮在终端输出之上）',
                    h(
                      'div',
                      { class: 'bg-terminal relative min-h-0 flex-1 p-2' },
                      [
                        h(
                          'pre',
                          {
                            class:
                              'text-term-fg font-mono text-[11px] leading-[1.5]',
                          },
                          'user@host:~$ ssh jac\nLast login: Wed Oct 15 09:12:04\nuser@host:~$ '
                        ),
                        h(SessionErrorNotice, {
                          class:
                            'absolute top-2 right-2 z-10 w-[min(380px,calc(100%-1rem))]',
                          title: 'SSH 终端连接失败',
                          message: '认证失败：服务器拒绝了 password 方式',
                        }),
                      ]
                    ),
                    'flex-1'
                  ),
                  // 设置页的皮肤预览 iframe：验证 skin-preview 也注入了浅色令牌
                  section(
                    '主题预览（设置页内嵌的 iframe）',
                    h(
                      'div',
                      { class: 'p-3' },
                      h(ThemePreview, {
                        values: {
                          ...DEFAULT_SETTINGS,
                          colorMode: state.scheme,
                        },
                      })
                    ),
                    'shrink-0'
                  ),
                ]),
                section(
                  h('div', { class: 'flex w-full items-center gap-2' }, [
                    h('span', '数据库连接状态页'),
                    h(
                      'div',
                      { class: 'ml-auto flex items-center gap-1' },
                      Object.keys(SCENARIOS).map(scenario =>
                        h(
                          'button',
                          {
                            type: 'button',
                            class: [
                              'seg',
                              state.scenario === scenario && 'seg-active',
                            ],
                            onClick: () => pickScenario(scenario),
                          },
                          scenario
                        )
                      )
                    ),
                  ]),
                  h(DatabaseConnectionState, {
                    status: state.status,
                    needsPassword:
                      state.status !== 'connecting' &&
                      state.errorKind === 'auth',
                    error: state.error,
                    errorKind: state.errorKind,
                    connection: PREVIEW_CONNECTION,
                    password: state.password,
                    'onUpdate:password': value => (state.password = value),
                    onConnect: simulateConnect,
                    onCancel: simulateCancel,
                  }),
                  'flex flex-1 flex-col'
                ),
              ]),
              h(ToastHost),
            ])
        },
      })
        .use(pinia)
        .use(i18n)
        .mount('#app')
    </script>
  </body>
</html>
