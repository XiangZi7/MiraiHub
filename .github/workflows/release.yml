name: Release

on:
  push:
    # 标签只能读取自身和默认分支的缓存；提前在 master 编译，供后续版本复用。
    branches:
      - 'master'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      tag:
        description: '已推送的版本标签，例如 v0.2.0；留空仅预热当前分支的构建缓存'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      CARGO_TERM_COLOR: always
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          package-manager-cache: false

      - name: Validate tag and synchronize application version
        if: env.RELEASE_TAG != ''
        id: version
        run: node scripts/release-version.mjs "$env:RELEASE_TAG" --github-output

      - name: Record source commit
        id: commit
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve release commit' }
          "sha=$commit" >> $env:GITHUB_OUTPUT

      - name: Require updater signing key
        if: env.RELEASE_TAG != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Configure the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing. See docs/RELEASING.md.'
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.96.0

      - name: Locate Tauri installer tools cache
        id: tauri-cache
        run: |
          $cachePath = Join-Path $env:LOCALAPPDATA 'tauri'
          "path=$cachePath" >> $env:GITHUB_OUTPUT

      - name: Cache Rust dependencies and installer tools
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-directories: ${{ steps.tauri-cache.outputs.path }}
          cache-on-failure: true

      - name: Test frontend utilities and release version logic
        run: pnpm test

      # 打包链路（beforeBuildCommand）只跑 vite build，类型检查在这里单独把关。
      - name: Type-check frontend
        run: pnpm typecheck

      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Warm production build cache without bundling
        if: env.RELEASE_TAG == ''
        run: pnpm tauri build --no-bundle -- --locked

      - name: Build application and NSIS installer
        if: env.RELEASE_TAG != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm release:build

      - name: Collect installer, portable archive and checksums
        if: env.RELEASE_TAG != ''
        env:
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/package-windows.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -Repository $env:RELEASE_REPOSITORY

      - name: Upload release files
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-release
          path: release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-unix:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - id: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      RELEASE_TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Install Linux build and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf libfuse2 xvfb dbus-x11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          package-manager-cache: false

      - name: Validate tag and synchronize application version
        if: env.RELEASE_TAG != ''
        run: node scripts/release-version.mjs "$RELEASE_TAG"

      - name: Record source commit
        run: echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Require updater signing key
        if: env.RELEASE_TAG != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing.' >&2; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add "$RELEASE_TARGET"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.id }}
          cache-on-failure: true

      - name: Test frontend and release utilities
        run: pnpm test

      - name: Type-check frontend
        run: pnpm typecheck

      - name: Test Rust backend
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          else
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          fi

      - name: Warm production build cache without bundling
        if: env.RELEASE_TAG == ''
        run: pnpm tauri build --target "$RELEASE_TARGET" --no-bundle -- --locked

      - name: Build application and native packages
        if: env.RELEASE_TAG != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm release:build

      - name: Collect native packages and checksums
        if: env.RELEASE_TAG != ''
        run: node scripts/package-unix.mjs "$RELEASE_TAG" "$RELEASE_COMMIT" "${{ matrix.id }}"

      - name: Upload release files
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.id }}-release
          path: release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-unix]
    if: needs.build-windows.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build-windows.outputs.tag }}
      RELEASE_VERSION: ${{ needs.build-windows.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.build-windows.outputs.prerelease }}
      RELEASE_COMMIT: ${{ needs.build-windows.outputs.commit }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release history for changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build-windows.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          package-manager-cache: false

      - name: Download tested build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-release'
          path: release-input

      - name: Verify files and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/assemble-release.mjs "$RELEASE_TAG" "$RELEASE_COMMIT" "$GH_REPO"
          cd release-output
          sha256sum --check --strict SHA256SUMS.txt

          # Check the remote tag still identifies the tested commit (including annotated tags).
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object')
          for attempt in 1 2 3 4 5; do
            if [ "$(jq -r '.type' <<< "$object")" != tag ]; then break; fi
            sha=$(jq -r '.sha' <<< "$object")
            object=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object')
          done
          test "$(jq -r '.type' <<< "$object")" = commit
          test "$(jq -r '.sha' <<< "$object")" = "$RELEASE_COMMIT"

          # Use published releases as the baseline so failed tags cannot hide changes.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" \
            | jq 'add // [] | map({tag_name, draft, prerelease})' > "$RUNNER_TEMP/published-releases.json"
          node ../scripts/release-notes.mjs "$RELEASE_TAG" "$GH_REPO" \
            "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/published-releases.json"

          if existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$existing" != true ]; then
              echo 'This version is already published. Create a new version tag instead of overwriting it.' >&2
              exit 1
            fi
          else
            # Keep the release in draft until every attachment has uploaded successfully.
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "MiraiHub $RELEASE_TAG" \
              --prerelease="$RELEASE_PRERELEASE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" ./* --clobber
          latest=true
          if [ "$RELEASE_PRERELEASE" = true ]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$RELEASE_PRERELEASE" --latest="$latest" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
